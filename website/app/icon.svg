<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1B24"/>
      <stop offset="100%" stop-color="#0E2530"/>
    </linearGradient>
  </defs>
  <!-- Rounded jungle tile -->
  <rect width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>
  <!-- Lime accent bar -->
  <rect x="0" y="0" width="256" height="6" fill="#ADFB49"/>
  <!-- Lime DN, geometric, optical-centred -->
  <text x="128" y="180" text-anchor="middle"
        font-family="Helvetica, Arial Black, sans-serif"
